<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GMGN 钱包采集器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 820px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: #0d0e12;
    color: #e4e6eb;
    padding: 14px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, #7c5cff, #4a9eff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #4a9eff);
    -webkit-text-fill-color: initial;
  }
  .ver {
    font-size: 11px; color: #6b7280;
    background: #1a1b23; padding: 2px 8px; border-radius: 10px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  input, select {
    padding: 7px 10px;
    background: #1a1b23; border: 1px solid #2a2b35; border-radius: 6px;
    color: #e4e6eb; font-size: 12px; outline: none;
  }
  input:focus, select:focus { border-color: #7c5cff; }
  input[type="text"] { flex: 1; min-width: 300px; }
  button {
    padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  .btn-primary {
    background: linear-gradient(90deg, #7c5cff, #4a9eff); color: #fff;
  }
  .btn-primary:disabled { background: #3a3b45; cursor: not-allowed; }
  .btn-secondary { background: #1a1b23; border: 1px solid #2a2b35; color: #c4c6cc; }
  label { font-size: 12px; color: #8b8d96; }
  #status {
    font-size: 11px; color: #8b8d96; margin: 6px 0; min-height: 16px;
    padding: 6px 10px; background: #1a1b23; border-radius: 6px;
    border-left: 3px solid #7c5cff;
  }
  #table-wrap {
    max-height: 480px; overflow: auto;
    border: 1px solid #2a2b35; border-radius: 8px;
    background: #14151b;
  }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td {
    padding: 7px 8px; border-bottom: 1px solid #22232b;
    text-align: center; white-space: nowrap;
  }
  th {
    background: #1a1b23; position: sticky; top: 0;
    font-weight: 600; color: #8b8d96; font-size: 10px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  tbody tr:hover { background: #1e1f28; }
  .pos { color: #2ecc71; }
  .neg { color: #ff4d6d; }
  #table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  #table-wrap::-webkit-scrollbar-thumb { background: #2a2b35; border-radius: 4px; }
  #table-wrap::-webkit-scrollbar-track { background: transparent; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .count { font-size: 11px; color: #8b8d96; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo"><span class="dot"></span>GMGN 钱包买入采集器</div>
    <div class="ver">v1.2</div>
  </div>
  <div class="row">
    <input type="text" id="addr" placeholder="粘贴钱包地址或 gmgn.ai 链接">
    <select id="days">
      <option value="0">全部</option>
      <option value="7">7天</option>
      <option value="30">30天</option>
    </select>
    <input type="number" id="limit" value="0" min="0" style="width:70px" title="0=全部">
    <label>条</label>
    <button id="start" class="btn-primary">开始采集</button>
    <button id="exportCsv" class="btn-secondary">CSV</button>
    <button id="exportXlsx" class="btn-secondary">Excel</button>
  </div>
  <div id="status">请先在浏览器打开 gmgn.ai 并登录，然后粘贴钱包地址点采集</div>
  <div id="table-wrap">
    <table id="tbl">
      <thead><tr>
        <th>币种</th><th>市值(买入时)</th><th>买入数量</th><th>金额(SOL)</th>
        <th>金额(USD)</th><th>总利润(USD)</th><th>总利润率</th>
        <th>时差</th><th>平台</th><th>买入时间</th><th>创建时间</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="footer">
    <span class="count" id="count">尚未采集</span>
  </div>
<script src="popup.js"></script>
</body>
</html>
